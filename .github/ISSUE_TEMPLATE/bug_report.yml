name: Bug report
description: Something does not work as expected.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please search existing issues first.
        Do not attach screenshots that contain private information.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the problem.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Press ⌥⇧1
        2. Select an area across two displays
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Capture
        - Scrolling capture
        - Recording
        - Editor
        - Tools (OCR, color, QR, measure)
        - Backdrop
        - Pin
        - Export / Quick Access
        - Upload
        - History
        - Workflows / URL scheme / CLI
        - Settings / Onboarding
        - Other
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: App version
      description: Settings → About
      placeholder: 0.1.0 (1)
    validations:
      required: true
  - type: input
    id: macos-version
    attributes:
      label: macOS version
      placeholder: macOS 15.1
    validations:
      required: true
  - type: dropdown
    id: hardware
    attributes:
      label: Mac
      options:
        - Apple Silicon
        - Intel
    validations:
      required: true
  - type: textarea
    id: displays
    attributes:
      label: Display setup
      description: Number of displays, resolutions and scaling, if relevant.
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        Optional. In Console.app, filter by the app's subsystem and paste relevant lines.
        Remove any personal information first.
      render: text
