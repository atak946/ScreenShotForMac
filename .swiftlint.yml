# SwiftLint configuration. Run `swiftlint lint`.

included:
  - Sources
  - App/Sources
  - Tests

excluded:
  - .build
  - .build-*
  - DerivedData
  - .swiftpm
  - ScreenShotForMac.xcodeproj

# Rules that fight Swift 6 concurrency patterns or the project's style.
disabled_rules:
  - todo                      # TODOs are tracked in code during development
  - trailing_comma            # SwiftFormat owns comma style
  - opening_brace             # SwiftFormat owns brace style
  - redundant_sendable        # explicit Sendable documents intent under strict concurrency
  - unneeded_synthesized_initializer
  - non_optional_string_data_conversion
  - nesting                   # nested types are used for namespacing

opt_in_rules:
  - closure_spacing
  - empty_count
  - empty_string
  - explicit_init
  - fatal_error_message
  - first_where
  - last_where
  # modifier_order is not opted in: SwiftFormat owns modifier order (it requires `private nonisolated`).
  - overridden_super_call
  - private_action
  - private_outlet
  - redundant_nil_coalescing
  - sorted_first_last
  - toggle_bool
  - unowned_variable_capture
  - vertical_parameter_alignment_on_call
  - yoda_condition

line_length:
  warning: 140
  error: 200
  ignores_comments: true
  ignores_urls: true
  ignores_interpolated_strings: true

file_length:
  warning: 400
  error: 800
  ignore_comment_only_lines: true

function_body_length:
  warning: 50
  error: 100

type_body_length:
  warning: 300
  error: 500

cyclomatic_complexity:
  warning: 15
  error: 25
  ignores_case_statements: true

function_parameter_count:
  warning: 6
  error: 8

large_tuple:
  warning: 3
  error: 4

identifier_name:
  min_length:
    warning: 1
  max_length:
    warning: 50
  excluded:
    - id
    - x
    - y
    - dx
    - dy
    - r
    - g
    - b
    - a
    - i
    - j
    - h
    - w

type_name:
  min_length: 2
  max_length: 50

reporter: xcode
